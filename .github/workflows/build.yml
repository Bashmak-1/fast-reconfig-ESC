name: Build

on:
  push:
    branches: [main, "feature/**"]  # feature branches build an artifact only (no release, no update channel)
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  build:
    # PyInstaller only produces a Windows .exe when run on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - run: pip install -r requirements.txt -r requirements-dev.txt

      - run: pytest tests/

      # Test branches must not call themselves stable (and must not be offered the dev updates): stamp a dev
      # version whose number (100000+run) is higher than any real dev build, so the app shows the DEV badge and
      # the in-app updater finds nothing newer.
      - name: Stamp test version (feature branches only)
        if: startsWith(github.ref_name, 'feature/')
        shell: bash
        run: |
          base=$(python -c "import re;print(re.search(r'\d+\.\d+\.\d+', open('src/esc_hotline/_version.py').read())[0])")
          python scripts/stamp_version.py v${base}-dev.$((100000 + ${{ github.run_number }}))

      - run: python scripts/build_exe.py

      - uses: actions/upload-artifact@v4
        with:
          name: EscHotline-exe
          path: |
            dist/EscHotline.exe
            dist/EscHotlineUpdater.exe
