name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    # PyInstaller only produces a Windows .exe when run on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - run: pip install -r requirements.txt -r requirements-dev.txt

      - run: pytest tests/

      - run: python scripts/build_exe.py
      - run: python scripts/build_exe.py --launcher
      # only the launcher is shipped, under the app's old file name (the bare app is never published)
      - run: mv -f dist/EscHotlineLauncher.exe dist/EscHotline.exe
        shell: bash

      - uses: actions/upload-artifact@v4
        with:
          name: EscHotline-exe
          path: |
            dist/EscHotline.exe
            dist/EscHotlineUpdater.exe
