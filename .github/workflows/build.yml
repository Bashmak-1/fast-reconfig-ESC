name: Build

on:
  push:
    branches: [main, "feature/**"]  # feature branches build an artifact only (no release, no update channel)
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  build:
    # PyInstaller only produces a Windows .exe when run on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - run: pip install -r requirements.txt -r requirements-dev.txt

      - run: pytest tests/

      - run: python scripts/build_exe.py

      - uses: actions/upload-artifact@v4
        with:
          name: EscHotline-exe
          path: |
            dist/EscHotline.exe
            dist/EscHotlineUpdater.exe
