name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # lets the default GITHUB_TOKEN publish a Release for this same repo

jobs:
  release:
    # PyInstaller only produces a Windows .exe when run on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - run: pip install -r requirements.txt -r requirements-dev.txt

      # Safety gate: a tag can point at a commit that skipped normal CI.
      - run: pytest tests/

      - run: python scripts/build_exe.py

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/EscHotline.exe
          generate_release_notes: true
