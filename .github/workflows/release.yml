name: Release

on:
  push:
    tags: ["v*.*.*", "!v*-dev*"]

permissions:
  contents: write # lets the default GITHUB_TOKEN publish a Release for this same repo

jobs:
  release:
    # PyInstaller only produces a Windows .exe when run on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - run: pip install -r requirements.txt -r requirements-dev.txt

      # Safety gate: a tag can point at a commit that skipped normal CI.
      - run: pytest tests/

      - name: Stamp the tag's version into the build
        run: python scripts/stamp_version.py ${{ github.ref_name }}

      - run: python scripts/build_exe.py

      # the launcher embeds the exe just built; the user list is NOT baked in (users.sha256 sits next to it)
      - run: python scripts/build_exe.py --launcher

      - name: Checksums for the in-app updater
        shell: bash
        run: cd dist && sha256sum EscHotline.exe EscHotlineUpdater.exe EscHotlineLauncher.exe > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/EscHotline.exe
            dist/EscHotlineUpdater.exe
            dist/EscHotlineLauncher.exe
            dist/SHA256SUMS.txt
          prerelease: false
          generate_release_notes: true
